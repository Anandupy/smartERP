$kind: http-request
url: "{{baseUrl}}/branches"
method: POST
body:
  type: json
  content: |-
    {
        "organizationId": "{{organizationId}}",
        "name": "Main Campus",
        "code": "MC-01",
        "institutionType": "SCHOOL",
        "contactEmail": "main@branch.com",
        "contactPhone": "+918888877777",
        "addressLine1": "123 Education Lane",
        "city": "Mumbai",
        "state": "Maharashtra",
        "country": "India",
        "pincode": "400001"
    }
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();
      if (response.success && response.data) {
          pm.environment.set("branchId", response.data.id);
      }
    language: text/javascript
order: 1000
