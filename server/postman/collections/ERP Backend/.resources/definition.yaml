$kind: collection
description: API collection for ERP Backend system modules including Auth, Organizations, Branches, and Academic Years.
variables:
  "{{baseUrl}}": ""
scripts:
  - type: http:afterResponse
    code: |-
      pm.test("Status code is 2xx", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      pm.test("Success flag is true", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.success).to.eql(true);
      });
    language: text/javascript
auth:
  - id: a4aa1b3d-a330-4f58-bcfd-240023470e69
    type: bearer
    name: bearer auth
    credentials:
      token: "{{accessToken}}"
