$kind: http-request
url: "{{baseUrl}}/organizations"
method: POST
body:
  type: json
  content: |-
    {
        "name": "Global Education Trust",
        "code": "GET-001",
        "contactEmail": "admin@get.org",
        "contactPhone": "+919000011111",
        "masterExpiryDate": "2027-12-31T23:59:59.999Z"
    }
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();
      if (response.success && response.data) {
          pm.environment.set("organizationId", response.data.id);
      }
    language: text/javascript
order: 1000
